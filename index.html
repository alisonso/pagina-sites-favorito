<!DOCTYPE html> <!-- Declara que o documento é HTML5 -->
<html lang="pt-BR"> <!-- Início da página, idioma português do Brasil -->
<head> <!-- Cabeçalho: informações sobre a página -->
    <meta charset="UTF-8"> <!-- Permite acentos e caracteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta a página para celulares -->
    <title>Meus sites favoritos</title> <!-- Título que aparece na aba do navegador -->
</head>
<body> <!-- Corpo: o que aparece na tela -->

    <h1>Meus sites favoritos: </h1> <!-- Título do corpo da página -->

    <!-- ===== SITE 1: YouTube ===== -->
    <h1>YouTube</h1> <!-- Nome do site ACIMA da imagem -->
    <a href="https://www.youtube.com" target="_blank"> <!-- Opcional: a imagem também é um link -->
        <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="Logo do YouTube" width="100"> <!-- Imagem do site -->
    </a>
    <br> <!-- Quebra de linha -->
    <a href="https://www.youtube.com" target="_blank">https://www.youtube.com</a> <!-- Link ABAIXO da imagem -->

    <!-- ===== SITE 2: GitHub ===== -->
    <h1>GitHub</h1> <!-- Nome do site -->
    <a href="https://github.com" target="_blank"> <!-- Imagem clicável -->
        <img src="https://www.google.com/s2/favicons?domain=github.com&sz=128" alt="Logo do GitHub" width="100"> <!-- Imagem do site -->
    </a>
    <br>
    <a href="https://github.com" target="_blank">https://github.com</a> <!-- Link do site -->

    <!-- ===== SITE 3: Instagram ===== -->
    <h1>Instagram</h1> <!-- Nome do site -->
    <a href="https://www.instagram.com" target="_blank"> <!-- Imagem clicável -->
        <img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128" alt="Logo do Instagram" width="100"> <!-- Imagem do site -->
    </a>
    <br>
    <a href="https://www.instagram.com" target="_blank">https://www.instagram.com</a> <!-- Link do site -->

    <!-- ===== SITE 4: Xbox ===== -->
    <h1>Xbox</h1> <!-- Nome do site -->
    <a href="https://www.xbox.com" target="_blank"> <!-- Imagem clicável -->
        <img src="https://www.google.com/s2/favicons?domain=xbox.com&sz=128" alt="Logo do Xbox" width="100"> <!-- Imagem do site -->
    </a>
    <br>
    <a href="https://www.xbox.com" target="_blank">https://www.xbox.com</a> <!-- Link do site -->

    <!-- ===== SITE 5: Steam ===== -->
    <h1>Steam</h1> <!-- Nome do site -->
    <a href="https://store.steampowered.com" target="_blank"> <!-- Imagem clicável -->
        <img src="https://www.google.com/s2/favicons?domain=steampowered.com&sz=128" alt="Logo da Steam" width="100"> <!-- Imagem do site -->
    </a>
    <br>
    <a href="https://store.steampowered.com" target="_blank">https://store.steampowered.com</a> <!-- Link do site -->

</body> <!-- Fim do corpo -->
</html> <!-- Fim da página -->
